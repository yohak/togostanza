<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Runtime parameters observation</title>
    <script type="module" src="../dist/parameter-probe.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        color: #1d2a2e;
      }

      main {
        display: grid;
        gap: 1.5rem;
      }

      section {
        display: grid;
        gap: 0.75rem;
      }

      .observation-card {
        border: 1px solid #c5d0d4;
        border-radius: 6px;
        padding: 1rem;
      }

      .observation-card h2 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
      }

      .observation-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Runtime parameters observation</h1>

      <section class="observation-card">
        <h2>boolean attribute present</h2>
        <togostanza-parameter-probe
          label="flag-present"
          count="42"
          flag
          payload='{"kind":"present","values":[1,2]}'
          mode="compact"
          note="text parameter present"
          --parameter-probe-gap="12"
          --parameter-probe-caption="style text present"
        ></togostanza-parameter-probe>
      </section>

      <section class="observation-card">
        <h2>boolean attribute absent</h2>
        <togostanza-parameter-probe
          label="flag-absent"
          count="0"
          payload='{"kind":"absent","enabled":false}'
          mode="comfortable"
          note="text parameter absent flag"
          --parameter-probe-gap="0"
          --parameter-probe-caption="style text absent flag"
        ></togostanza-parameter-probe>
      </section>

      <section class="observation-card">
        <h2>flag="false"</h2>
        <togostanza-parameter-probe
          label="flag-string-false"
          count="7.5"
          flag="false"
          payload='["false-string",{"nested":true}]'
          mode="compact"
          note="text parameter false flag"
          --parameter-probe-gap="7.5"
          --parameter-probe-caption="style text false flag"
        ></togostanza-parameter-probe>
      </section>

      <section class="observation-card">
        <h2>attribute mutation target</h2>
        <togostanza-parameter-probe
          id="mutation-target"
          label="before-mutation"
          count="1"
          payload='{"kind":"mutation","step":"initial"}'
          mode="compact"
          note="before text mutation"
          --parameter-probe-gap="4"
          --parameter-probe-caption="before style text mutation"
        ></togostanza-parameter-probe>
        <div class="observation-controls" aria-label="mutation controls">
          <button type="button" data-action="set-present-flag">set flag</button>
          <button type="button" data-action="set-string-false-flag">set flag false</button>
          <button type="button" data-action="remove-flag">remove flag</button>
          <button type="button" data-action="set-count">set count</button>
          <button type="button" data-action="set-payload">set payload</button>
          <button type="button" data-action="set-mode">set mode</button>
          <button type="button" data-action="set-note">set note</button>
          <button type="button" data-action="set-style-values">set style values</button>
        </div>
      </section>
    </main>

    <script type="module">
      const target = document.querySelector('#mutation-target');

      window.parameterProbeObserver = {
        target,
        setPresentFlag() {
          target.setAttribute('flag', '');
        },
        setStringFalseFlag() {
          target.setAttribute('flag', 'false');
        },
        removeFlag() {
          target.removeAttribute('flag');
        },
        setCount(value) {
          target.setAttribute('count', String(value));
        },
        setPayload(value) {
          target.setAttribute('payload', JSON.stringify(value));
        },
        setMode(value) {
          target.setAttribute('mode', value);
        },
        setNote(value) {
          target.setAttribute('note', value);
        },
        setStyleValues(gap, caption) {
          target.setAttribute('--parameter-probe-gap', String(gap));
          target.setAttribute('--parameter-probe-caption', caption);
        }
      };

      document.querySelector('[data-action="set-present-flag"]')
        .addEventListener('click', () => window.parameterProbeObserver.setPresentFlag());
      document.querySelector('[data-action="set-string-false-flag"]')
        .addEventListener('click', () => window.parameterProbeObserver.setStringFalseFlag());
      document.querySelector('[data-action="remove-flag"]')
        .addEventListener('click', () => window.parameterProbeObserver.removeFlag());
      document.querySelector('[data-action="set-count"]')
        .addEventListener('click', () => window.parameterProbeObserver.setCount(9.25));
      document.querySelector('[data-action="set-payload"]')
        .addEventListener('click', () => window.parameterProbeObserver.setPayload({
          kind: 'mutation',
          step: 'changed',
          values: [3, 4]
        }));
      document.querySelector('[data-action="set-mode"]')
        .addEventListener('click', () => window.parameterProbeObserver.setMode('comfortable'));
      document.querySelector('[data-action="set-note"]')
        .addEventListener('click', () => window.parameterProbeObserver.setNote('after text mutation'));
      document.querySelector('[data-action="set-style-values"]')
        .addEventListener('click', () => window.parameterProbeObserver.setStyleValues(16, 'after style text mutation'));
    </script>
  </body>
</html>
