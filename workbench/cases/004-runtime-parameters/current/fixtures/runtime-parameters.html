<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Runtime parameters fixture</title>
    <script type="module" src="../dist/parameter-probe.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        color: #1d2a2e;
      }

      main {
        display: grid;
        gap: 1.5rem;
      }

      section {
        display: grid;
        gap: 0.75rem;
      }

      .fixture-card {
        border: 1px solid #c5d0d4;
        border-radius: 6px;
        padding: 1rem;
      }

      .fixture-card h2 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
      }

      .fixture-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Runtime parameters fixture</h1>

      <section class="fixture-card">
        <h2>boolean attribute present</h2>
        <togostanza-parameter-probe
          label="flag-present"
          count="42"
          flag
          payload='{"kind":"present","values":[1,2]}'
        ></togostanza-parameter-probe>
      </section>

      <section class="fixture-card">
        <h2>boolean attribute absent</h2>
        <togostanza-parameter-probe
          label="flag-absent"
          count="0"
          payload='{"kind":"absent","enabled":false}'
        ></togostanza-parameter-probe>
      </section>

      <section class="fixture-card">
        <h2>flag="false"</h2>
        <togostanza-parameter-probe
          label="flag-string-false"
          count="7.5"
          flag="false"
          payload='["false-string",{"nested":true}]'
        ></togostanza-parameter-probe>
      </section>

      <section class="fixture-card">
        <h2>attribute mutation target</h2>
        <togostanza-parameter-probe
          id="mutation-target"
          label="before-mutation"
          count="1"
          payload='{"kind":"mutation","step":"initial"}'
        ></togostanza-parameter-probe>
        <div class="fixture-controls" aria-label="mutation controls">
          <button type="button" data-action="set-present-flag">set flag</button>
          <button type="button" data-action="set-string-false-flag">set flag false</button>
          <button type="button" data-action="remove-flag">remove flag</button>
          <button type="button" data-action="set-count">set count</button>
          <button type="button" data-action="set-payload">set payload</button>
        </div>
      </section>
    </main>

    <script type="module">
      const target = document.querySelector('#mutation-target');

      window.parameterProbeFixture = {
        target,
        setPresentFlag() {
          target.setAttribute('flag', '');
        },
        setStringFalseFlag() {
          target.setAttribute('flag', 'false');
        },
        removeFlag() {
          target.removeAttribute('flag');
        },
        setCount(value) {
          target.setAttribute('count', String(value));
        },
        setPayload(value) {
          target.setAttribute('payload', JSON.stringify(value));
        }
      };

      document.querySelector('[data-action="set-present-flag"]')
        .addEventListener('click', () => window.parameterProbeFixture.setPresentFlag());
      document.querySelector('[data-action="set-string-false-flag"]')
        .addEventListener('click', () => window.parameterProbeFixture.setStringFalseFlag());
      document.querySelector('[data-action="remove-flag"]')
        .addEventListener('click', () => window.parameterProbeFixture.removeFlag());
      document.querySelector('[data-action="set-count"]')
        .addEventListener('click', () => window.parameterProbeFixture.setCount(9.25));
      document.querySelector('[data-action="set-payload"]')
        .addEventListener('click', () => window.parameterProbeFixture.setPayload({
          kind: 'mutation',
          step: 'changed',
          values: [3, 4]
        }));
    </script>
  </body>
</html>
